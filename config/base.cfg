[buildout]
extends =
    https://raw.githubusercontent.com/collective/experimental-plone-pins/d696c01c07e694d1e32ab9c49c2d6adc66a2f888/plone62-py311+/versions.cfg
parts =
    scripts
    supervisor
develop =
show-picked-versions = true
# plone.namedfile 6.3.0 does not provide the extra 'blobs'
allow-unknown-extras=true
find-links +=
    https://pypi.syslab.com/packages

[settings]
main-package = Euphorie
http-address = 8080
http-fast-listen = off

zeo-address = ${buildout:directory}/var/zeo.socket
file-storage = ${buildout:directory}/var/filestorage/Data.fs
blob-storage = ${buildout:directory}/var/blobstorage

alembic_script_location = ${buildout:directory}/src/Euphorie/src/euphorie/deployment/upgrade/alembic
saconfig-uri = sqlite://
sqlalchemy_echo = false

[zeo]
recipe = plone.recipe.zeoserver
zeo-address = ${settings:zeo-address}
file-storage = ${settings:file-storage}
blob-storage = ${settings:blob-storage}
eggs = ${instance:eggs}
zeopack-script-name = zeopacker

[instance]
recipe = plone.recipe.zope2instance
user = admin:admin
http-address = ${settings:http-address}
http-fast-listen = ${settings:http-fast-listen}
zeo-client = on
zeo-address = ${settings:zeo-address}
shared-blob = on
file-storage = ${settings:file-storage}
blob-storage = ${settings:blob-storage}
eggs =
    ${settings:main-package}
    psycopg2-binary
    rich
    slowlog
    plone.reload
zcml =
    ${settings:main-package}
    euphorie.deployment-meta
    euphorie.deployment
    euphorie.deployment-overrides

zcml-additional =
   <configure xmlns="http://namespaces.zope.org/zope"
              xmlns:db="http://namespaces.zope.org/db">
       <include package="z3c.saconfig" file="meta.zcml" />
       <db:engine name="session" url="${settings:saconfig-uri}" echo="${settings:sqlalchemy_echo}" />
       <db:session engine="session" />
   </configure>
environment-vars =
    PREFER_Z3C_PT 1
    PYTHONWARNINGS ignore:::pkg_resources
    zope_i18n_compile_mo_files 1
wsgi-ini-template = ${buildout:directory}/templates/wsgi.ini
event-log-handler = logging.handlers.TimedRotatingFileHandler
event-log-args  = ("${buildout:directory}/var/log/${:_buildout_section_name_}.log",)
event-log-kwargs = {"when": "D", "interval": 1, "backupCount": 14}
access-log-handler = logging.handlers.TimedRotatingFileHandler
access-log-args  = ("${buildout:directory}/var/log/${:_buildout_section_name_}-access.log",)
access-log-kwargs = {"when": "D", "interval": 1, "backupCount": 14}

[instance1]
<= instance
http-address = 8081

[instance2]
<= instance
http-address = 8082

[instance3]
<= instance
http-address = 8083

[instance4]
<= instance
http-address = 8084

[alembic.ini]
recipe = collective.recipe.template
input = ${buildout:directory}/templates/${:_buildout_section_name_}
output = ${buildout:directory}/etc/${:_buildout_section_name_}

[scripts]
recipe = zc.recipe.egg
dependent-scripts = true
interpreter = zopepy
eggs = ${instance:eggs}

[testenv]
PYTHONWARNINGS = ignore:::pkg_resources
zope_i18n_compile_mo_files = 1

[test]
recipe = zc.recipe.testrunner
defaults = ['-s', '${settings:main-package}', '--auto-color', '--auto-progress']
eggs =
    ${settings:main-package} [tests]
environment = testenv

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}
ignores =
    bcrypt
    beautifulsoup4
    cffi
    cryptography

[versions]
Euphorie = 20.1.1
NuPlone = 6.0.0
dsetool.policy = 1.3.0
osha.oira = 14.0.1
oira.statistics.tools = 1.0.1
oira.statistics.deployment = 1.1.3
plonestatic.euphorie = 2.0.0

# We still do not support SQLAlchemy 2
alembic = 1.19.2
sqlalchemy = 1.4.54

# Pinned automatically
anytree = 2.13.0
chardet = 7.7.0
cloudpickle = 3.1.2
collective.recipe.supervisor = 2.0.0
cssutils = 2.15.0
encutils = 1.0.0
et-xmlfile = 2.0.0
ftw.upgrade = 4.0.0+slc.2
joblib = 1.6.0
markdownify = 1.2.3
mobile.sniffer = 1.0.0
narwhals = 2.28.0
nltk = 3.10.4
numpy = 2.5.4
openpyxl = 3.1.5
perfmetrics = 4.3.0
plone.formwidget.recaptcha = 2.3.0
plone.patternslib = 9.11.1
psycopg2-binary = 2.9.13
py-bcrypt = 0.4
python-docx = 1.2.0
python-Levenshtein = 0.27.5
RapidFuzz = 3.14.6
regex = 2026.9.29
repoze.formapi = 0.6.1
scikit-learn = 1.9.1
scipy = 1.18.1
slc.zopescript = 2.0.0
slowlog = 0.9
StoneageHTML = 1.0.0
superlance = 2.0.0
threadpoolctl = 3.7.0
tqdm = 4.70.1
ua-parser = 1.0.2
ua-parser-builtins = 202610
user-agents = 2.2.0
z3c.ptcompat = 5.0
z3c.saconfig = 2.1
zope.app.publication = 6.0
zope.authentication = 6.0
zope.error = 6.0
zope.sqlalchemy = 4.1

[supervisor]
recipe = collective.recipe.supervisor
plugins = superlance
http-socket = unix
file = ${buildout:directory}/var/supervisord.sock
programs =
    10 zeo ${zeo:location}/bin/runzeo ${zeo:location}

[zopepy]
recipe = zc.recipe.egg
eggs = ${instance:eggs}
interpreter = zopepy
dependent-scripts = true
